services:
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"], interval: 5s, timeout: 5s, retries: 10}
  web:
    build: .
    env_file: .env
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"
    volumes: [media_data:/app/media, static_data:/app/staticfiles]
    depends_on: {db: {condition: service_healthy}}
  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: [./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro, media_data:/app/media:ro, static_data:/app/static:ro]
    depends_on: [web]
volumes: {postgres_data: {}, media_data: {}, static_data: {}}
