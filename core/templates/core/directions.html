{% extends 'core/base.html' %}{% block content %}<h1>Категории курсов</h1><div class="grid">{% for d in directions %}<article class="card"><h2>{{ d.title }}</h2><p class="muted">{{ d.description }}</p><p><span class="badge">{{ d.courses.count }} курсов</span></p><a class="btn" href="{% url 'courses' %}?direction={{ d.id }}">Показать курсы</a></article>{% endfor %}</div>{% endblock %}
