{% extends 'core/base.html' %}{% block content %}<h1>Редактирование материала</h1><form class="card" method="post" enctype="multipart/form-data">{% csrf_token %}<label>Название</label><input name="title" value="{{ lesson.title }}" required><div class="form-grid"><div><label>Раздел</label><select name="category"><option value="LESSON" {% if lesson.category == 'LESSON' %}selected{% endif %}>Учебный материал</option><option value="NPA_RK" {% if lesson.category == 'NPA_RK' %}selected{% endif %}>НПА РК</option></select></div><div><label>Тип</label><select name="kind"><option value="DOC" {% if lesson.kind == 'DOC' %}selected{% endif %}>PDF</option><option value="LINK" {% if lesson.kind == 'LINK' %}selected{% endif %}>Ссылка / PDF Google Drive</option><option value="VIDEO" {% if lesson.kind == 'VIDEO' %}selected{% endif %}>Видео YouTube / Google Drive</option></select></div><div><label>Порядок</label><input type="number" min="1" name="order" value="{{ lesson.order }}"></div><div><label>Новый PDF</label><input type="file" name="file" accept="application/pdf"></div></div><label>Ссылка</label><input type="url" name="url" value="{{ lesson.url }}"><p><button>Сохранить</button> <a class="btn secondary" href="{% url 'course_manage' %}">Отмена</a></p></form>{% endblock %}
