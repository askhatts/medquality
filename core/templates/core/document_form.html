{% extends 'core/base.html' %}{% block content %}<h1>{% if document %}Редактирование документа{% else %}Новый документ{% endif %}</h1><form class="card" method="post" enctype="multipart/form-data">{% csrf_token %}<div class="form-grid"><div><label>Название</label><input name="title" value="{{ document.title|default:'' }}" required></div><div><label>Номер</label><input name="number" value="{{ document.number|default:'' }}"></div><div><label>Тип</label><select name="document_type">{% for value,label in document_types %}<option value="{{ value }}" {% if document.document_type == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div><div><label>Версия</label><input name="version" value="{{ document.version|default:'1.0' }}" required></div><div><label>Владелец документа</label><input name="owner" value="{{ document.owner|default:'' }}"></div><div><label>Категория</label><select name="direction"><option value="">—</option>{% for d in directions %}<option value="{{ d.id }}" {% if document.direction_id == d.id %}selected{% endif %}>{{ d.title }}</option>{% endfor %}</select></div><div><label>Дата утверждения</label><input type="date" name="approved_at" value="{{ document.approved_at|date:'Y-m-d' }}"></div><div><label>Следующий пересмотр</label><input type="date" name="review_due" value="{{ document.review_due|date:'Y-m-d' }}"></div><div><label>Отдел</label><select name="department"><option value="">Общий</option>{% for d in departments %}<option value="{{ d.id }}">{{ d.name }}</option>{% endfor %}</select></div><div><label>Статус</label><select name="status"><option value="ACTIVE">Действует</option><option value="ARCHIVED">Архив</option></select></div><div><label>PDF</label><input type="file" name="file" accept="application/pdf" {% if not document %}required{% endif %}></div><div><label>Теги</label><input name="tags" value="{{ document.tags|default:'' }}"></div></div><label>Использовать в курсах</label><div class="checkboxes">{% for course in courses %}<label><input style="width:auto" type="checkbox" name="courses" value="{{ course.id }}" {% if document and course in document.courses.all %}checked{% endif %}> {{ course.title }}</label>{% endfor %}</div><p><button>Сохранить</button></p></form>{% endblock %}
