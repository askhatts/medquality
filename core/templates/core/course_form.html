{% extends 'core/base.html' %}{% block content %}<a href="{% url 'course_manage' %}">← Все курсы</a><h1>{% if course %}Редактирование курса{% else %}Новый курс{% endif %}</h1><form class="card" method="post">{% csrf_token %}<label>Категория курса</label><input name="category" list="course-categories" value="{{ course.direction.title|default:'' }}" placeholder="Например: Безопасность пациента" required><datalist id="course-categories">{% for d in directions %}<option value="{{ d.title }}">{% endfor %}</datalist><p class="muted">Можно вписать новую категорию или выбрать существующую из подсказок.</p><label>Название курса</label><input name="title" value="{{ course.title|default:'' }}" required maxlength="255"><label>Краткое описание</label><textarea name="description" rows="5">{{ course.description|default:'' }}</textarea><label><input style="width:auto" type="checkbox" name="active" {% if not course or course.active %}checked{% endif %}> Курс активен и виден сотрудникам</label><p><button>Сохранить и перейти к наполнению</button> <a class="btn secondary" href="{% url 'course_manage' %}">Отмена</a></p></form>{% endblock %}
