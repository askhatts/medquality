{% extends 'core/base.html' %}{% block content %}<div class="topline"><h1>{% if employee %}Карточка сотрудника{% else %}Новый сотрудник{% endif %}</h1><a href="{% url 'employees' %}">← К списку</a></div><form class="card" method="post">{% csrf_token %}<div class="form-grid"><div><label>Логин</label><input name="username" required value="{{ employee.user.username|default:'' }}" {% if employee %}readonly{% endif %}></div>{% if not employee %}<div><label>Временный пароль</label><input name="password" required type="password"></div>{% endif %}<div><label>Имя</label><input name="first_name" required value="{{ employee.user.first_name|default:'' }}"></div><div><label>Фамилия</label><input name="last_name" required value="{{ employee.user.last_name|default:'' }}"></div><div><label>Роль</label><select name="role">{% for value,title in roles %}<option value="{{ value }}" {% if employee.role == value %}selected{% endif %}>{{ title }}</option>{% endfor %}</select></div><div><label>Тип сотрудника</label><select name="employee_type" required><option value="">Выберите тип</option>{% for t in types %}<option value="{{ t.id }}" {% if employee.employee_type_id == t.id %}selected{% endif %}>{{ t.name }}</option>{% endfor %}</select></div><div><label>Отдел / отделение</label><select name="department" required><option value="">Выберите отдел</option>{% for d in departments %}<option value="{{ d.id }}" {% if employee.department_id == d.id %}selected{% endif %}>{{ d.name }}</option>{% endfor %}</select></div><div><label>Должность</label><input name="position" required value="{{ employee.position|default:'' }}"></div><div><label>Табельный номер</label><input name="employee_number" value="{{ employee.employee_number|default:'' }}"></div><div><label>Телефон</label><input name="phone" value="{{ employee.phone|default:'' }}"></div></div><p><button>Сохранить</button></p></form>{% endblock %}
