{% load static %}
<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">
<title>{% block title %}Открытые разделы — ЦЯМиО{% endblock %}</title><link rel="icon" href="{% static 'core/cyamio-logo.png' %}">
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f7fb;color:#16334d;font:16px/1.6 'Segoe UI',Arial,sans-serif}main{max-width:920px;margin:auto;padding:24px 18px 64px}header{display:flex;gap:18px;align-items:center}header img{width:78px;height:78px;object-fit:contain}h1{font-size:clamp(24px,4vw,34px);line-height:1.2;color:#072b52}h2{font-size:21px}.card,fieldset{margin:20px 0;padding:22px;border:1px solid #d9e6ef;border-radius:14px;background:#fff}fieldset{min-width:0}legend{font-weight:650;padding:0 6px;max-width:100%}.muted{color:#60778a}label{display:block;padding:9px 0;cursor:pointer}input[type=radio],input[type=checkbox]{width:20px;height:20px;vertical-align:middle;margin-right:9px;accent-color:#1674b8}select,textarea{width:100%;padding:11px;border:1px solid #bfd1dd;border-radius:8px;font:inherit}button,.btn{display:inline-block;padding:13px 20px;border:0;border-radius:9px;background:#0d5b9d;color:#fff;font:inherit;text-decoration:none;cursor:pointer}.errorlist{color:#a82633;background:#fff0f1;padding:12px 28px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 22px}a{color:#0d5b9d}small{font-size:13px}.notice{border-left:4px solid #1674b8}.section-card{padding:28px;background:linear-gradient(145deg,#fff,#edf6fc);box-shadow:0 12px 28px #072b5210}.section-card h2{font-size:26px;line-height:1.3}.kicker{font-weight:700;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:#0d5b9d}footer{margin-top:32px}a:focus-visible,button:focus-visible{outline:3px solid #5ab3e5;outline-offset:4px}@media(max-width:640px){.grid{grid-template-columns:1fr}header{align-items:flex-start}header img{width:55px;height:55px}fieldset,.card{padding:16px}}
</style></head><body><main>
<header><img src="{% static 'core/cyamio-logo.png' %}" alt="Эмблема ЦЯМиО"><div><span class="muted">Центр ядерной медицины и онкологии</span><h1>{% block heading %}Открытые разделы портала{% endblock %}</h1></div></header>
{% block content %}{% endblock %}
<footer><a href="{% url 'login' %}">Вход для сотрудников</a></footer>
</main></body></html>
