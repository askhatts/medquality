services:
  quality:
    build: .
    container_name: quality_app
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY}"
      DJANGO_ALLOWED_HOSTS: "oncomap-abai.kz,www.oncomap-abai.kz"
      DJANGO_CSRF_TRUSTED_ORIGINS: "https://oncomap-abai.kz,https://www.oncomap-abai.kz"
      USE_SQLITE: "1"
      SQLITE_PATH: "/data/db.sqlite3"
      MEDIA_ROOT: "/data/media"
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 60"
    volumes:
      - ./data:/data
    networks:
      - onco
    mem_limit: 320m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; request=urllib.request.Request('http://127.0.0.1:8000/quality/health/', headers={'Host':'oncomap-abai.kz'}); urllib.request.urlopen(request, timeout=4).close()"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  onco:
    external: true
    name: deploy_default
