# Overlay for the Onco-GIS stack on the shared 4 GiB VPS.
# Apply together with /opt/onco/deploy/docker-compose.yml.
services:
  backend:
    mem_limit: 1300m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/meta', timeout=5).close()"]
      interval: 30s
      timeout: 7s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  caddy:
    mem_limit: 256m
    pids_limit: 64
    volumes:
      - ../frontend/public:/srv/onco-public:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
